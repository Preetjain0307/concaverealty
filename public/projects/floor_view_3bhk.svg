<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid_3bhk" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#grid_3bhk)"/>

  <!-- Outer Architectural Boundary -->
  <rect x="35" y="35" width="730" height="530" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>

  <!-- Living & Dining Room -->
  <rect x="50" y="50" width="460" height="240" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
  <text x="280" y="150" text-anchor="middle" fill="#92400e" font-size="16" font-family="serif" font-weight="bold">CROSS-VENTILATED LIVING &amp; DINING</text>
  <text x="280" y="175" text-anchor="middle" fill="#b45309" font-size="11" font-family="monospace">24'-0" × 16'-6" • EAST-WEST BREEZE</text>

  <!-- Sundeck Balcony -->
  <rect x="525" y="50" width="225" height="130" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="637" y="110" text-anchor="middle" fill="#0369a1" font-size="13" font-family="sans-serif" font-weight="bold">PANORAMIC SUNDECK</text>
  <text x="637" y="132" text-anchor="middle" fill="#0284c7" font-size="10" font-family="monospace">14'-0" × 6'-0"</text>

  <!-- Modular Kitchen -->
  <rect x="525" y="195" width="225" height="150" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="637" y="260" text-anchor="middle" fill="#991b1b" font-size="13" font-family="sans-serif" font-weight="bold">MODULAR KITCHEN</text>
  <text x="637" y="282" text-anchor="middle" fill="#dc2626" font-size="10" font-family="monospace">12'-0" × 9'-6"</text>

  <!-- Master Suite (Bedroom 1) -->
  <rect x="50" y="305" width="300" height="245" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="200" y="405" text-anchor="middle" fill="#166534" font-size="15" font-family="serif" font-weight="bold">MASTER SUITE 01</text>
  <text x="200" y="428" text-anchor="middle" fill="#15803d" font-size="11" font-family="monospace">18'-0" × 13'-6"</text>
  <rect x="70" y="455" width="120" height="75" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="130" y="495" text-anchor="middle" fill="#14532d" font-size="10" font-family="sans-serif" font-weight="bold">WALK-IN DRESSER</text>
  <rect x="205" y="455" width="125" height="75" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="267" y="495" text-anchor="middle" fill="#14532d" font-size="10" font-family="sans-serif" font-weight="bold">EN-SUITE BATH</text>

  <!-- Bedroom 02 -->
  <rect x="365" y="360" width="185" height="190" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="457" y="445" text-anchor="middle" fill="#6b21a8" font-size="13" font-family="sans-serif" font-weight="bold">BEDROOM 02</text>
  <text x="457" y="468" text-anchor="middle" fill="#7e22ce" font-size="10" font-family="monospace">14'-0" × 11'-6"</text>

  <!-- Bedroom 03 -->
  <rect x="565" y="360" width="185" height="190" fill="#fdf4ff" stroke="#c084fc" stroke-width="2"/>
  <text x="657" y="445" text-anchor="middle" fill="#7e22ce" font-size="13" font-family="sans-serif" font-weight="bold">BEDROOM 03</text>
  <text x="657" y="468" text-anchor="middle" fill="#9333ea" font-size="10" font-family="monospace">13'-0" × 11'-0"</text>

  <!-- Blueprint Title Label -->
  <rect x="260" y="540" width="280" height="25" fill="#1e293b" rx="4"/>
  <text x="400" y="557" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">ROYALE 3 BHK • 1,280 SQ.FT CA</text>
</svg>
