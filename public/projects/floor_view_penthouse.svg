<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid_ph" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.7"/>
    </pattern>
    <pattern id="deck_pattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="0" stroke="#93c5fd" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#grid_ph)"/>

  <!-- Outer Architectural Boundary -->
  <rect x="35" y="35" width="730" height="530" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>

  <!-- Wrap-Around Panoramic Sky Terrace Deck -->
  <rect x="50" y="50" width="700" height="105" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <rect x="50" y="50" width="700" height="105" fill="url(#deck_pattern)" opacity="0.6"/>
  <text x="360" y="95" text-anchor="middle" fill="#0369a1" font-size="14" font-family="sans-serif" font-weight="bold" letter-spacing="2">WRAP-AROUND PANORAMIC SKY DECK (80' × 12')</text>
  <text x="360" y="115" text-anchor="middle" fill="#0284c7" font-size="10" font-family="monospace">Seamless Glass Balustrade • 360° Arabian Sea View</text>

  <!-- Cantilevered Heated Plunge Pool -->
  <rect x="530" y="55" width="205" height="90" rx="8" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>
  <rect x="545" y="65" width="175" height="70" rx="4" fill="#bae6fd" stroke="#0369a1" stroke-width="1.5"/>
  <text x="632" y="105" text-anchor="middle" fill="#0369a1" font-size="12" font-family="sans-serif" font-weight="bold">HEATED PLUNGE POOL</text>
  <text x="632" y="122" text-anchor="middle" fill="#0284c7" font-size="9" font-family="monospace">24'-0" × 10'-0"</text>

  <!-- Double Height Grand Living & Dining Salon -->
  <rect x="220" y="170" width="350" height="230" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
  <text x="395" y="270" text-anchor="middle" fill="#92400e" font-size="16" font-family="serif" font-weight="bold">DOUBLE-HEIGHT GRAND LIVING SALON</text>
  <text x="395" y="295" text-anchor="middle" fill="#b45309" font-size="12" font-family="monospace">32'-0" × 22'-6" • 24 FT CEILING</text>
  <rect x="300" y="330" width="190" height="50" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="395" y="360" text-anchor="middle" fill="#78350f" font-size="10" font-family="sans-serif">FORMAL DINING PAVILION</text>

  <!-- Private Biometric Elevator Foyer -->
  <rect x="55" y="170" width="150" height="150" fill="#f1f5f9" stroke="#1e293b" stroke-width="2.5"/>
  <rect x="75" y="185" width="45" height="45" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <rect x="135" y="185" width="45" height="45" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="97" y="212" text-anchor="middle" fill="#1e293b" font-size="9" font-family="sans-serif" font-weight="bold">LIFT 1</text>
  <text x="157" y="212" text-anchor="middle" fill="#1e293b" font-size="9" font-family="sans-serif" font-weight="bold">LIFT 2</text>
  <text x="130" y="260" text-anchor="middle" fill="#0f172a" font-size="11" font-family="sans-serif" font-weight="bold">BIOMETRIC FOYER</text>
  <text x="130" y="280" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">16'-0" × 14'-0"</text>

  <!-- Show Kitchen & Butler Pantry -->
  <rect x="585" y="170" width="165" height="150" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="667" y="235" text-anchor="middle" fill="#991b1b" font-size="12" font-family="sans-serif" font-weight="bold">MODULAR ISLAND</text>
  <text x="667" y="255" text-anchor="middle" fill="#b91c1c" font-size="12" font-family="sans-serif" font-weight="bold">CHEF KITCHEN</text>
  <text x="667" y="280" text-anchor="middle" fill="#ef4444" font-size="9" font-family="monospace">18'-0" × 12'-0"</text>

  <!-- Master Presidential Bedroom Suite -->
  <rect x="55" y="335" width="280" height="215" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="195" y="420" text-anchor="middle" fill="#166534" font-size="14" font-family="serif" font-weight="bold">MASTER PRESIDENTIAL SUITE</text>
  <text x="195" y="442" text-anchor="middle" fill="#15803d" font-size="11" font-family="monospace">24'-0" × 18'-0" • PRIVATE BALCONY</text>
  <!-- Walk-In Dresser & En-Suite Spa Bath -->
  <rect x="75" y="470" width="115" height="65" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="132" y="505" text-anchor="middle" fill="#14532d" font-size="9" font-family="sans-serif" font-weight="bold">WALK-IN CLOSET</text>
  <rect x="200" y="470" width="120" height="65" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="260" y="505" text-anchor="middle" fill="#14532d" font-size="9" font-family="sans-serif" font-weight="bold">JACUZZI BATH</text>

  <!-- Junior Penthouse Suites & Family Den -->
  <rect x="350" y="415" width="220" height="135" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="460" y="475" text-anchor="middle" fill="#6b21a8" font-size="13" font-family="sans-serif" font-weight="bold">JUNIOR SUITE 02</text>
  <text x="460" y="498" text-anchor="middle" fill="#7e22ce" font-size="10" font-family="monospace">18'-0" × 14'-0"</text>

  <rect x="585" y="335" width="165" height="215" fill="#fdf4ff" stroke="#c084fc" stroke-width="2"/>
  <text x="667" y="435" text-anchor="middle" fill="#7e22ce" font-size="13" font-family="sans-serif" font-weight="bold">GUEST SUITE 03</text>
  <text x="667" y="458" text-anchor="middle" fill="#9333ea" font-size="10" font-family="monospace">16'-0" × 13'-0"</text>
  <rect x="600" y="485" width="135" height="50" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
  <text x="667" y="515" text-anchor="middle" fill="#6b21a8" font-size="9" font-family="sans-serif">EN-SUITE BATH</text>

  <!-- Blueprint Title Label -->
  <rect x="260" y="535" width="280" height="25" fill="#1e293b" rx="4"/>
  <text x="400" y="552" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">LEVEL 46-47 SKY DUPLEX • 3,450 SQ.FT</text>
</svg>
