<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e7ff" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#f1f5f9"/>
  <rect width="100%" height="100%" fill="url(#grid2)"/>

  <!-- Clubhouse Outer Border -->
  <rect x="40" y="40" width="720" height="520" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>

  <!-- Olympic Pool Deck -->
  <rect x="80" y="80" width="360" height="220" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="260" y="180" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0369a1">50M LAP INFINITY POOL DECK</text>
  <text x="260" y="205" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0284c7">Depth: 1.2m - 1.8m • Temperature Controlled</text>
  <rect x="100" y="240" width="120" height="45" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="160" y="267" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#0369a1">KIDS JACUZZI POOL</text>

  <!-- Wellness Spa & Sauna Wing -->
  <rect x="460" y="80" width="260" height="220" fill="#fdf4ff" stroke="#c084fc" stroke-width="2.5"/>
  <text x="590" y="130" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7e22ce">AYURVEDIC SPA &amp; SAUNA</text>
  <line x1="460" y1="160" x2="720" y2="160" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="525" y="210" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#9333ea">STEAM SUITE</text>
  <text x="655" y="210" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#9333ea">ICE FOUNTAIN</text>

  <!-- Gymnasium & Yoga Studio -->
  <rect x="80" y="320" width="300" height="200" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <text x="230" y="390" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">FITNESS ARENA &amp; GYM</text>
  <text x="230" y="415" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#16a34a">TechnoGym Cardio &amp; Strength Equipment</text>
  <rect x="100" y="440" width="120" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="160" y="475" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#15803d">YOGA &amp; AEROBICS</text>

  <!-- Banquet & Private Screening Theatre -->
  <rect x="400" y="320" width="320" height="200" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="560" y="380" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#b45309">GRAND BANQUET &amp; BALLROOM</text>
  <text x="560" y="405" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#d97706">Capacity: 250 Guests • Private Terrace Access</text>
  <rect x="430" y="430" width="130" height="70" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="495" y="470" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#92400e">PRIVATE CINEMA</text>
  <rect x="580" y="430" width="120" height="70" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="640" y="470" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#92400e">INDOOR GAMES</text>

  <!-- Title Block -->
  <rect x="260" y="525" width="280" height="30" fill="#1e293b" rx="4"/>
  <text x="400" y="545" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">CLUBHOUSE &amp; PODIUM AMENITIES LEVEL PLAN</text>
</svg>