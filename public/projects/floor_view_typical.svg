<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#cbd5e1" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Outer Walls -->
  <rect x="50" y="50" width="700" height="500" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Central Lift Lobby Core -->
  <rect x="320" y="210" width="160" height="180" fill="#f1f5f9" stroke="#1e293b" stroke-width="3"/>
  <text x="400" y="305" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">ELEVATOR LOBBY</text>
  <rect x="335" y="225" width="55" height="55" fill="url(#hatch)" stroke="#64748b" stroke-width="1.5"/>
  <text x="362" y="255" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#1e293b">LIFT 1</text>
  <rect x="410" y="225" width="55" height="55" fill="url(#hatch)" stroke="#64748b" stroke-width="1.5"/>
  <text x="437" y="255" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#1e293b">LIFT 2</text>
  <rect x="360" y="330" width="80" height="45" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <text x="400" y="355" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#64748b">FIRE STAIRS</text>

  <!-- UNIT 01 -->
  <rect x="50" y="50" width="270" height="240" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="50" y1="170" x2="320" y2="170" stroke="#334155" stroke-width="1.5"/>
  <line x1="180" y1="50" x2="180" y2="170" stroke="#334155" stroke-width="1.5"/>
  <text x="115" y="115" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#334155">MASTER SUITE</text>
  <text x="115" y="130" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#64748b">14'0" x 12'6"</text>
  <text x="250" y="115" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#334155">BEDROOM 2</text>
  <text x="250" y="130" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#64748b">11'6" x 11'0"</text>
  <text x="185" y="225" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">GRAND LIVING &amp; DINING</text>
  <text x="185" y="240" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#64748b">22'0" x 14'0"</text>
  <rect x="50" y="240" width="60" height="50" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="80" y="270" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#16a34a">SUNDECK</text>

  <!-- UNIT 02 -->
  <rect x="480" y="50" width="270" height="240" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="480" y1="170" x2="750" y2="170" stroke="#334155" stroke-width="1.5"/>
  <line x1="620" y1="50" x2="620" y2="170" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="115" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#334155">BEDROOM 2</text>
  <text x="550" y="130" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#64748b">11'6" x 11'0"</text>
  <text x="685" y="115" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#334155">MASTER SUITE</text>
  <text x="685" y="130" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#64748b">14'0" x 12'6"</text>
  <text x="615" y="225" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">GRAND LIVING &amp; DINING</text>
  <text x="615" y="240" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#64748b">22'0" x 14'0"</text>
  <rect x="690" y="240" width="60" height="50" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="720" y="270" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#16a34a">SUNDECK</text>

  <!-- UNIT 03 -->
  <rect x="50" y="290" width="270" height="260" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="50" y1="420" x2="320" y2="420" stroke="#334155" stroke-width="1.5"/>
  <line x1="180" y1="420" x2="180" y2="550" stroke="#334155" stroke-width="1.5"/>
  <text x="185" y="360" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">GRAND LIVING &amp; DINING</text>
  <text x="115" y="475" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#334155">MASTER SUITE</text>
  <text x="250" y="475" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#334155">MODULAR KITCHEN</text>

  <!-- UNIT 04 -->
  <rect x="480" y="290" width="270" height="260" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="480" y1="420" x2="750" y2="420" stroke="#334155" stroke-width="1.5"/>
  <line x1="620" y1="420" x2="620" y2="550" stroke="#334155" stroke-width="1.5"/>
  <text x="615" y="360" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">GRAND LIVING &amp; DINING</text>
  <text x="550" y="475" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#334155">MODULAR KITCHEN</text>
  <text x="685" y="475" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#334155">MASTER SUITE</text>

  <!-- Architectural Title Block -->
  <rect x="250" y="500" width="300" height="42" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="400" y="518" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#0f172a">TYPICAL RESIDENTIAL CLUSTER FLOOR PLAN</text>
  <text x="400" y="533" font-family="monospace" font-size="8" text-anchor="middle" fill="#64748b">SCALE 1:100 • ARCHITECTURAL WORKING DRAWING</text>
</svg>